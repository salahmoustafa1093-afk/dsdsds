# النبض اليومي: الأحد للخميس 7:40 الصبح بتوقيت القاهرة. شغل خفيف ومن غير workflow.
# مفيش vault_ids لحد ما يبقى فيه credential (المرحلة 3).
name: gff-radar-daily-pulse
agent: ./agent.md
environment_id: ./environment.yaml
resources:
  - ./memory_store-market-knowledge.yaml
schedule:
  type: cron
  expression: "40 7 * * 0-4"
  timezone: Africa/Cairo
budget:
  type: limit
  max_list_cost: {currency: USD, amount: "400"}
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          ده النبض اليومي. المسارات كلها جوه /mnt/memory/gff-market-knowledge/.
          اقرا sources/registry.md و sources/price-log.md و calendar/ وآخر 3 سطور في log/.
          1) هات أسعار النهارده من مصادر الأسعار اليومية: أعلاف، ذرة صفرا، كسب صويا، ردة، برسيم، فراخ وكتاكيت وبيض، مواشي حية.
             سجّلها في كل الأحوال في sources/prices/<السنة-الشهر>.md بالرابط والتاريخ، وحدّث آخر قيمة لكل بند في sources/price-log.md.
          2) دوّر على أي تحذير بيطري أو قرار حكومي جديد يخص الأعلاف أو الثروة الحيوانية أو الدواجن في مصر من وقت آخر نبض مسجّل في log/. يوم الأحد ده معناه آخر 72 ساعة على الأقل.
          3) شوف لو فيه ملف شكاوى جديد في tracking/inbox/ فيه شكوى جودة لمنتج تحت التجربة.
          4) شوف لو فيه موسم أو ميعاد توصية قرب خلال 6 أسابيع في calendar/.
          لو فيه تغيّر سعر أكبر من 5%، أو تحذير، أو قرار مهم، أو شكوى جودة:
          اكتب ملاحظة قصيرة (5 سطور بالكتير) في /mnt/session/outputs/pulse-<التاريخ>.md فيها إيه اللي حصل، والمصدر والتاريخ، وتأثيره المتوقع على المربي الصغير وعلى GFF.
          لو مفيش حاجة من دول، ماتكتبش ملاحظة، واكتب سطر "مفيش جديد مهم" في log/.
          وفي الحالتين زوّد سطر التشغيل في log/<السنة-الشهر>.md.
