# بيئة تشغيل "رادار": سحابية، والإنترنت مفتوح لأن البحث محتاج مصادر كتير متغيرة.
# البيانات اللي بتدخل الجلسة مجمّعة ومن غير بيانات شخصية، وأي مفاتيح بتتحط في vault مش هنا.
# لو حبيتوا تقفلوها لاحقاً: غيّروا لـ limited وحطوا قايمة المواقع في allowed_hosts (ولازم نفس القايمة في allowed_domains للبحث).
config:
  type: cloud
  networking:
    type: unrestricted
