# التقرير الأسبوعي: كل سبت 7:10 الصبح بتوقيت القاهرة، جاهز لاجتماع الأسبوع.
# بيبدأ بـ outcome: مقيّم مستقل بيراجع التقرير على المعايير دي ويرجّعه للتعديل لو ناقص.
# المعايير دي بداية - عدّلوها بعد أول 3-4 تقارير.
# مفيش vault_ids لحد ما يبقى فيه credential (المرحلة 3).
name: gff-radar-weekly-brief
agent: ./agent.md
environment_id: ./environment.yaml
resources:
  - ./memory_store-market-knowledge.yaml
schedule:
  type: cron
  expression: "10 7 * * 6"
  timezone: Africa/Cairo
budget:
  type: limit
  max_list_cost: {currency: USD, amount: "2500"}
initial_events:
  - type: user.define_outcome
    description: |
      اكتب تقرير رادار الأسبوعي لإدارة GFF عن الأسبوع اللي فات، على قالب templates/weekly-brief.md.
      احفظه في /mnt/session/outputs/weekly-brief-<تاريخ السبت>.md.
      المسارات كلها جوه /mnt/memory/gff-market-knowledge/.
      استخدم:
      - الذاكرة: pipeline/ و competitors/ و tracking/ و segments/ و sources/prices/ و log/.
      - ملفات tracking/inbox/: مبيعات، استبيانات، ملاحظات المندوبين، أسعار القرى، شكاوى.
      - البحث على الإنترنت عن مستجدات الأسبوع.
      لو فيه ميعاد توصية موسمية في calendar/ خلال 6 أسابيع، ضيف التوصية كملحق.
      بعد التقرير حدّث الذاكرة وزوّد سطر في log/.
    max_iterations: 3
    rubric:
      type: text
      content: |
        # معايير التقرير الأسبوعي (نسخة أولى)
        1. أول قسم "الخلاصة في 5 سطور" موجود، وفيه أهم 3 حاجات حصلت وأهم قرار مطلوب من الإدارة.
        2. فيه جدول أسعار الأسبوع لـ 6 بنود على الأقل: علف تسمين، علف بياض أو تسمين دواجن، ذرة صفرا، كسب صويا، ردة، وسعر حي لنوع واحد على الأقل. كل سعر معاه المصدر والتاريخ والتغيّر عن الأسبوع اللي فات، أو مكتوب جنبه "مش متاح".
        3. قسم "رادار المنتجات" فيه:
           - حالة كل كارت في pipeline/index.md.
           - سطر "جديد عند المنافسين" (أو "مفيش جديد").
           - أي فرصة جديدة متقيّمة بالمعايير الستة، بدرجة وسبب لكل معيار.
        4. قسم "عملاء المنتجات الجديدة" فيه أرقام فعلية من ملفات المبيعات (عدد المشترين، تكرار الشراء)، أو جملة صريحة إن الملف ماوصلش، واسم الملف المطلوب ومين يرفعه.
        5. قسم "صوت المربي" فيه لحد 3 ملاحظات عن الشريحة المستهدفة، كل واحدة متعلمة حقيقة/تقدير/فرضية ومعاها مصدرها. أو فيه جملة صريحة إن مفيش مدخلات جديدة الأسبوع ده وإيه المطلوب.
        6. قسم "الأسبوع الجاي" فيه 3-5 مهام محددة، كل مهمة مكتوب مين يعملها (رادار / مندوب / مدير فرع / الإدارة).
        7. مفيش رقم تليفون أو اسم فرد أو عنوان لعميل في التقرير.
        8. كل رابط في التقرير مكتوب جنبه تاريخ فتحه ومذكور في ملحق المصادر، ومفيش رقم من غير مصدر أو طريقة حساب.
        9. مكتوب بعربي مصري بسيط، وطول التقرير مايزيدش عن صفحتين تقريباً (حوالي 900 كلمة) من غير الملاحق.
