# التقرير الأسبوعي: كل سبت 7:10 الصبح بتوقيت القاهرة، جاهز لاجتماع الأسبوع.
# بيبدأ بـ outcome: مقيّم مستقل بيراجع التقرير على المعايير دي ويرجّعه للتعديل لو ناقص.
# المعايير دي بداية - عدّلوها بعد أول 3-4 تقارير.
name: gff-radar-weekly-brief
agent: ./agent.md
environment_id: ./environment.yaml
vault_ids: []
resources:
  - ./memory_store-market-knowledge.yaml
schedule:
  type: cron
  expression: "10 7 * * 6"
  timezone: Africa/Cairo
budget:
  type: limit
  max_list_cost: {currency: USD, amount: "2500"}
initial_events:
  - type: user.define_outcome
    description: |
      اكتب تقرير رادار الأسبوعي لإدارة GFF عن الأسبوع اللي فات، على قالب /templates/weekly-brief.md،
      واحفظه في outputs باسم weekly-brief-<تاريخ السبت>.md. استخدم الذاكرة (/pipeline، /tracking، /segments، /sources/price-log.md، /log)
      وأي ملفات تصدير من الـERP مرفوعة للجلسة، وابحث على الإنترنت عن مستجدات الأسبوع. بعد التقرير حدّث الذاكرة وزوّد سطر في /log/.
    max_iterations: 3
    rubric:
      type: text
      content: |
        # معايير التقرير الأسبوعي (نسخة أولى)
        1. أول قسم "الخلاصة في 5 سطور" موجود، وفيه أهم 3 حاجات حصلت وأهم قرار مطلوب من الإدارة.
        2. فيه جدول أسعار الأسبوع لـ 6 بنود على الأقل (علف تسمين، علف بياض أو تسمين دواجن، ذرة صفرا، كسب صويا، ردة، وسعر حي لنوع واحد على الأقل)، كل سعر معاه المصدر والتاريخ والتغيّر عن الأسبوع اللي فات أو "مش متاح".
        3. قسم "رادار المنتجات" فيه حالة كل كارت في /pipeline/index.md، وأي فرصة جديدة متقيّمة بالمعايير الستة بدرجة وسبب لكل معيار.
        4. قسم "عملاء المنتجات الجديدة" فيه أرقام فعلية من بيانات المبيعات (عدد المشترين، تكرار الشراء) أو جملة صريحة إن البيانات ماوصلتش وإيه الملف المطلوب بالظبط.
        5. قسم "صوت المربي" فيه 3 ملاحظات على الأقل عن الشريحة المستهدفة، كل واحدة متعلمة حقيقة/تقدير/فرضية ومعاها مصدرها.
        6. قسم "الأسبوع الجاي" فيه 3-5 مهام محددة، كل مهمة مكتوب مين يعملها (رادار / مندوب / مدير فرع / الإدارة).
        7. مفيش رقم تليفون أو اسم فرد أو عنوان لعميل في التقرير.
        8. كل رابط في التقرير اتفتح فعلاً في الجلسة، ومفيش رقم من غير مصدر أو طريقة حساب.
        9. مكتوب بعربي مصري بسيط، وطول التقرير مايزيدش عن صفحتين تقريباً (حوالي 900 كلمة) من غير الملاحق.
