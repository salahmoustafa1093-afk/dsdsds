# البحث الشهري العميق: يوم 1 من كل شهر 9:20 الصبح بتوقيت القاهرة.
# الموضوع بيتحدد من /segments/research-agenda.md (المشرف بيرتّب الأولويات هناك).
name: gff-radar-monthly-deep-dive
agent: ./agent.md
environment_id: ./environment.yaml
vault_ids: []
resources:
  - ./memory_store-market-knowledge.yaml
schedule:
  type: cron
  expression: "20 9 1 * *"
  timezone: Africa/Cairo
budget:
  type: limit
  max_list_cost: {currency: USD, amount: "5000"}
initial_events:
  - type: user.define_outcome
    description: |
      خد أول موضوع مفتوح في /segments/research-agenda.md (شريحة فرعية أو فرصة منتج) واعمل عنه بحث عميق.
      استخدم workflow لتوزيع القراية على مصادر كتير بالتوازي، وبعدين اجمع وراجع بنفسك.
      المخرج: ملف deep-dive-<الشهر>-<الموضوع>.md في outputs على قالب /templates/deep-dive.md،
      واستبيان ميداني قصير بالعامية (8-12 سؤال) يغطي الفرضيات اللي لسه محتاجة تحقق، على قالب /templates/field-survey.md.
      بعد كده حدّث ملف الشريحة أو كارت الفرصة في الذاكرة، وعلّم الموضوع "اتعمل" في research-agenda.md، وزوّد سطر في /log/.
    max_iterations: 3
    rubric:
      type: text
      content: |
        # معايير البحث الشهري (نسخة أولى)
        1. البحث بيجاوب على أسئلة الموضوع المكتوبة في research-agenda.md واحد واحد، والسؤال اللي ماتجاوبش مكتوب ليه.
        2. فيه تقدير لحجم الشريحة أو الطلب (عدد مربين / رؤوس / طن في السنة) مع طريقة الحساب ومصادر كل رقم وتاريخه، ومدى ثقة (عالي/متوسط/ضعيف).
        3. فيه وصف لسلوك الشرا: بيشتري منين، بكميات قد إيه، كل قد إيه، بيدفع إزاي، ومين بيقرر - كل نقطة متعلمة حقيقة/تقدير/فرضية.
        4. فيه مقارنة بالبدايل والمنافسين اللي المربي بيستخدمهم فعلاً (بما فيها الخلطة البيتي)، بالسعر للكيلو أو للراس لو متاح.
        5. فيه 3 توصيات عملية لـ GFF على الأكتر، كل توصية فيها: المطلوب، التكلفة التقريبية، الفرع المقترح للتجربة، ومقياس النجاح.
        6. الاستبيان الميداني 8-12 سؤال، بالعامية، مايطلبش بيانات شخصية غير الضرورية، وفيه سؤال موافقة على التواصل.
        7. مفيش رابط ما اتفتحش في الجلسة، ومفيش رقم من غير مصدر أو طريقة حساب.
