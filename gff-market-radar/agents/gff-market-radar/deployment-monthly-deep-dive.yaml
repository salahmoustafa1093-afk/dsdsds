# البحث الشهري العميق: يوم 1 من كل شهر 9:20 الصبح بتوقيت القاهرة.
# الموضوع بيتحدد من segments/research-agenda.md: المفتوح اللي آخر ميعاد قراره أقرب.
# ممكن يتشغل يدوي في أي وقت (ant beta:deployments run) لما يبقى فيه موضوع مستعجل.
# مفيش vault_ids لحد ما يبقى فيه credential (المرحلة 3).
name: gff-radar-monthly-deep-dive
agent: ./agent.md
environment_id: ./environment.yaml
resources:
  - ./memory_store-market-knowledge.yaml
schedule:
  type: cron
  expression: "20 9 1 * *"
  timezone: Africa/Cairo
budget:
  type: limit
  max_list_cost: {currency: USD, amount: "5000"}
initial_events:
  - type: user.define_outcome
    description: |
      المسارات كلها جوه /mnt/memory/gff-market-knowledge/.
      من segments/research-agenda.md خد الموضوع اللي حالته "مفتوح" وعمود "آخر ميعاد للقرار" بتاعه أقرب، واعمل عنه بحث عميق.
      استخدم workflow لتوزيع القراية على مصادر كتير بالتوازي، وابعت لكل مساعد التاريخ والمسارات كاملة. بعدين اجمع وراجع بنفسك.
      المخرج:
      - ملف /mnt/session/outputs/deep-dive-<الشهر>-<الموضوع>.md على قالب templates/deep-dive.md.
      - استبيان ميداني قصير بالعامية (10-12 سؤال) يغطي الفرضيات اللي لسه محتاجة تحقق، على قالب templates/field-survey.md، في /mnt/session/outputs/survey-<الموضوع>.md.
      بعد كده:
      - حدّث ملف الشريحة أو كارت الفرصة في الذاكرة.
      - علّم الموضوع "اتعمل" في research-agenda.md.
      - زوّد سطر في log/.
    max_iterations: 3
    rubric:
      type: text
      content: |
        # معايير البحث الشهري (نسخة أولى)
        1. البحث بيجاوب على أسئلة الموضوع المكتوبة في research-agenda.md واحد واحد، والسؤال اللي ماتجاوبش مكتوب ليه.
        2. فيه تقدير لحجم الشريحة أو الطلب (عدد مربين / رؤوس / طن في السنة)، مع:
           - طريقة الحساب.
           - مصدر كل رقم وتاريخه.
           - درجة الثقة (عالي/متوسط/ضعيف).
        3. فيه وصف لسلوك الشرا: بيشتري منين، بكميات قد إيه، كل قد إيه، بيدفع إزاي، ومين بيقرر. كل نقطة متعلمة حقيقة/تقدير/فرضية.
        4. فيه مقارنة بالبدايل والمنافسين اللي المربي بيستخدمهم فعلاً (بما فيها الخلطة البيتي)، بالسعر للكيلو أو للراس لو متاح.
        5. فيه 3 توصيات عملية لـ GFF على الأكتر. كل توصية فيها: المطلوب، التكلفة التقريبية، الفرع المقترح للتجربة، ومقياس النجاح.
        6. الاستبيان الميداني 10-12 سؤال بالعامية، مايطلبش اسم أو تليفون في ورقة الاستبيان، ومحدد فيه إزاي الموافقة على التواصل بتتسجل لوحدها.
        7. كل رابط مكتوب جنبه تاريخ فتحه ومذكور في قسم المصادر، ومفيش رقم من غير مصدر أو طريقة حساب.
